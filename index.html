<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azamat Yakubbaev — 3D Portfolio</title>
  <meta name="description" content="An interactive 3D town of Azamat Yakubbaev's work: ERP systems, Telegram apps, AI tools and open source projects." />
  <meta name="theme-color" content="#1a1a3e" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!--
    Quicksand — yumaloq, "qog'ozga qo'lda yozilgan" hissi beruvchi shrift,
    cartoon uslubga mos. preconnect — shrift serveriga ulanishni oldindan
    ochib, yuklanishni tezlashtiradi.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />

  <!--
    Import map — brauzerga "three" degan nom qayerdan yuklanishini aytadi.
    Shu tufayli main.js ichida xuddi npm loyihasidagidek
    `import * as THREE from 'three'` deb yoza olamiz, lekin hamma narsa
    CDN (jsdelivr) orqali keladi — hech qanday bundler kerak emas.
    Versiya qat'iy belgilangan (0.170.0), shunda CDN yangilanishi
    loyihani kutilmaganda buzib qo'ymaydi.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!--
    Canvas'ni HTML'da o'zimiz yaratamiz (renderer avtomatik yaratganidan ko'ra),
    shunda CSS orqali uni to'liq boshqarish osonroq bo'ladi.
  -->
  <canvas id="scene"></canvas>

  <!--
    Card overlay — 3D canvas USTIDA turadigan HTML qatlam.
    Konteynerning o'zi pointer-events: none (sichqoncha undan o'tib
    canvas'ga tegadi), faqat ochilgan card pointer-events: auto oladi.
    Har bir card data-section orqali 3D dagi qavat userData.id ga mos.
  -->
  <!--
    Yuklanish ekrani — three.js va sahna tayyor bo'lguncha ko'rinadi,
    birinchi kadr chizilgach main.js uni so'ndiradi (ui.js: hideLoader).
  -->
  <div id="loader">
    <div class="loader-name">AZAMAT YAKUBBAEV</div>
    <div class="loader-sub">Building the town…</div>
    <div class="loader-bar"><i></i></div>
  </div>

  <!--
    Card overlay — 3D canvas USTIDA turadigan HTML qatlam.
    Konteynerning o'zi pointer-events: none (sichqoncha undan o'tib
    canvas'ga tegadi), faqat ochilgan card pointer-events: auto oladi.
    Cardlar endi shu yerda qo'lda yozilmaydi: ui.js ularni data.js
    dagi kontentdan generatsiya qiladi (har biri data-section yoki
    data-hotspot atributi bilan 3D obyektga bog'lanadi).
  -->
  <div class="card-overlay"></div>

  <!--
    Tur paneli — "▶ Tour" rejimida joriy bekat nomi va progress.
  -->
  <div id="tour-bar">
    <span class="tour-step"></span>
    <span class="tour-title"></span>
    <button id="tour-stop">Stop</button>
    <div class="tour-progress"><i></i></div>
  </div>

  <!-- Dock — pastki navigatsiya; tugmalarni ui.js yasaydi -->
  <nav id="dock" aria-label="Sections"></nav>

  <!--
    Hotspot taklif pufakchasi — 3D nuqta ekran koordinatasiga
    proyeksiyalanadi (controllableOrb.js), shu div o'sha joyga suriladi.
  -->
  <div id="orb-tooltip"></div>

  <!-- Boshqaruv eslatmasi — doim ko'rinib turadigan kichik belgi -->
  <div class="control-hint">
    <span class="hint-desktop">Fly the firefly with <b>WASD / arrow keys</b> · click a building to visit</span>
    <span class="hint-mobile">Fly the firefly with the joystick</span>
  </div>

  <!-- Virtual joystick — faqat touch qurilmalarda ko'rinadi (CSS) -->
  <div id="joystick">
    <div id="joystick-knob"></div>
  </div>

  <!--
    Loyiha versiyasi — burchakdagi kichik belgi.
    Semantik tartib: 0.MINOR.PATCH — har yirik bosqich (yangi bo'lim,
    yangi vizual qatlam) MINOR'ni oshiradi, mayda tuzatishlar PATCH'ni.
    Hozirgacha: 0.1 fundament → 0.2 uy → 0.3 interaktivlik →
    0.4 cardlar → 0.5 atrof-muhit → 0.6 deraza ichki manzaralari →
    0.7 jonlilik (qushlar, shamol, tutun, bulutlar, yulduzlar) →
    0.8 uchar chiroq (boshqariladigan orb + maxfiy hotspotlar) →
    1.0 loyihalar shaharchasi (8 bino, kamera parvozi, tur rejimi,
    kun/tun, bloom, haqiqiy kontent data.js dan).
  -->
  <div class="version-badge">v1.0.0</div>

  <!-- type="module" shart: import/export sintaksisi faqat modullarda ishlaydi -->
  <script type="module" src="main.js"></script>
</body>
</html>
